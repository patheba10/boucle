name: Base de données

# Applique les migrations de supabase/migrations au projet Supabase de production.
# Ne tourne que si le projet est configuré (variable SUPABASE_PROJECT_ID et deux secrets, voir docs/comptes.md),
# sur main (après une PR dont la CI, tests pgTAP compris, est verte) ou à la main.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-de-donnees
  cancel-in-progress: false

jobs:
  migrations:
    name: Appliquer les migrations
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.1

      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migrations à appliquer
        run: supabase db push --dry-run

      - name: Appliquer
        run: supabase db push
