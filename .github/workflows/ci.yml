name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Valider les exercices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Installer les dépendances Node
        run: npm ci

      - name: Vérifier g++
        run: g++ --version

      - name: Tests unitaires (simulateur Git)
        run: npm run test:unit

      - name: Installer les bibliothèques Python (versions de Pyodide)
        run: pip install -r requirements.txt

      - name: Valider tout le contenu (Python, g++, interpréteur navigateur)
        run: npm run validate

  e2e:
    name: Tests e2e (navigateur)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Le runner fournit déjà Google Chrome et ses bibliothèques : on s'en sert
      # pour ne pas dépendre des miroirs apt d'Ubuntu (pannes vues au sprint 3.1).
      - name: Installer Playwright (Chrome du runner)
        run: |
          pip install -r requirements-dev.txt
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Parcours élève dans un vrai navigateur (CDN réels)
        run: python -m pytest -q tests/e2e

  deploy-github-pages:
    name: Publier sur GitHub Pages
    needs: [validate-content, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
