name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Valider les exercices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Installer les dépendances Node
        run: npm ci

      - name: Vérifier g++
        run: g++ --version

      - name: Installer les bibliothèques Python (versions de Pyodide)
        run: pip install -r requirements.txt

      - name: Tests unitaires (simulateurs, moteurs SQL et Python)
        run: npm run test:unit

      - name: Valider tout le contenu (Python, g++, interpréteur navigateur)
        run: npm run validate

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Installer les outils
        run: |
          npm ci
          pip install pip-audit==2.10.1

      - name: npm audit et pip-audit (exceptions justifiées dans scripts/audit.mjs)
        run: npm run audit

  e2e:
    name: Tests e2e (navigateur)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Le runner fournit déjà Google Chrome et ses bibliothèques : on s'en sert
      # pour ne pas dépendre des miroirs apt d'Ubuntu (pannes vues au sprint 3.1).
      - name: Installer Playwright (Chrome du runner)
        run: |
          pip install -r requirements-dev.txt
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Parcours élève dans un vrai navigateur (CDN réels)
        run: python -m pytest -q tests/e2e

  tensorflow:
    name: Vérifier le code Keras avec TensorFlow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-tf.txt

      - name: Installer TensorFlow (CPU)
        run: pip install -r requirements-tf.txt

      # Le navigateur exécute le code Keras avec minikeras ; ici, le même code doit donner les mêmes résultats avec Keras 3.
      - name: Défis et extraits Keras avec le vrai TensorFlow
        run: PYTHON=python node scripts/verifier_tf.mjs

  deploy-github-pages:
    name: Publier sur GitHub Pages
    needs: [validate-content, audit, e2e, tensorflow]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
