name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Valider les exercices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances Node
        run: npm ci

      - name: Vérifier g++
        run: g++ --version

      - name: Valider tout le contenu (Python, g++, interpréteur navigateur)
        run: npm run validate

  deploy-github-pages:
    name: Publier sur GitHub Pages
    needs: validate-content
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_TOKEN: ${{ secrets.BOUCLE_SITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le jeton de publication
        id: token
        run: |
          if [ -z "$SITE_TOKEN" ]; then
            echo "::warning::Secret BOUCLE_SITE_TOKEN absent : publication GitHub Pages ignorée."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pousser public/ vers le dépôt public boucle-site
        if: steps.token.outputs.ok == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BOUCLE_SITE_TOKEN }}
          external_repository: patheba10/boucle-site
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898299+github-actions[bot]@users.noreply.github.com"
          commit_message: "Publication depuis boucle"
