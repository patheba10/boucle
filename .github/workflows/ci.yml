name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Valider les exercices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances Node
        run: npm ci

      - name: Vérifier g++
        run: g++ --version

      - name: Tests unitaires (simulateur Git)
        run: npm run test:unit

      - name: Installer les bibliothèques Python (versions de Pyodide)
        run: pip install -r requirements.txt

      - name: Valider tout le contenu (Python, g++, interpréteur navigateur)
        run: npm run validate

  e2e:
    name: Tests e2e (navigateur)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Le runner fournit déjà Google Chrome et ses bibliothèques : on s'en sert
      # pour ne pas dépendre des miroirs apt d'Ubuntu (pannes vues au sprint 3.1).
      - name: Installer Playwright (Chrome du runner)
        run: |
          pip install -r requirements-dev.txt
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Parcours élève dans un vrai navigateur (CDN réels)
        run: python -m pytest -q tests/e2e

  deploy-github-pages:
    name: Publier sur GitHub Pages
    needs: [validate-content, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@v4
