# Dependabot propose une PR quand une action utilisée par la CI publie une nouvelle version.
# Les actions sont épinglées sur un SHA : Dependabot met à jour le SHA et le commentaire de version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
